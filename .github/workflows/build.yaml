name: Build
on:
  push:
    paths-ignore:
      - "assets/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
    branches:
      - "main"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: ./build.sh --skip-pnpm-prune

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run component tests
        run: pnpm run test:component

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Analyze bundle size
        run: pnpm run analyze:bundle

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup E2E environment
        run: node --import tsx scripts/setup-e2e.ts

      - name: Show e2e config
        run: |
          for config in tests/e2e/.headplane-e2e.yaml tests/e2e/.headscale-e2e.yaml; do
            echo "::group::$config"
            sed -E 's/^([[:space:]]*(cookie_secret|api_key):).*/\1 "[REDACTED]"/' "$config"
            echo "::endgroup::"
          done
          echo "::group::tests/e2e/.e2e-state.json"
          sed -E 's/"apiKey": ".*"/"apiKey": "[REDACTED]"/' tests/e2e/.e2e-state.json
          echo "::endgroup::"

      - name: Run e2e tests
        run: pnpm run test:e2e
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: true
          VITE_OPTIMIZE_DEPS_BUILD_SYNC: true

      - name: Cleanup E2E environment
        if: always()
        run: docker rm -f headscale-e2e || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm run build

      - name: Run Lighthouse CI
        run: pnpm run lighthouse:ci

  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@main

      - name: Check flake outputs
        run: nix flake check
