name: Build
on:
  push:
    paths-ignore:
      - "assets/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
    branches:
      - "main"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: ./build.sh --skip-pnpm-prune

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run component tests
        run: pnpm run test:component

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Analyze bundle size
        run: pnpm run analyze:bundle

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create e2e config templates
        run: |
          mkdir -p tests/e2e
          cat > tests/e2e/.headplane-e2e.yaml << 'EOF'
          server:
            host: "127.0.0.1"
            port: 3100
            base_url: "http://127.0.0.1:3100"
            data_path: "./tests/e2e/data"
            cookie_secret: "0123456789abcdef0123456789abcdef"
            cookie_secure: false
          headscale:
            url: "http://localhost:8080"
            config_path: "./tests/e2e/.headscale-e2e.yaml"
          EOF
          cat > tests/e2e/.headscale-e2e.yaml << 'EOF'
          dns:
            magic_dns: true
            base_domain: example.com
            nameservers:
              global:
                - 1.1.1.1
            search_domains: []
            extra_records: []
          EOF

      - name: Run e2e tests
        run: pnpm run test:e2e
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: true
          VITE_OPTIMIZE_DEPS_BUILD_SYNC: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm run build

      - name: Run Lighthouse CI
        run: pnpm run lighthouse:ci

  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@main

      - name: Check flake outputs
        run: nix flake check
